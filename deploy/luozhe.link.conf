# 初始版本的站点配置（参考用）。
# 线上实际配置文件：/etc/nginx/sites-available/luozhe.link
# certbot 已在其后追加了 443 server 块、证书路径和 HTTP→HTTPS 跳转，
# 所以不要再拿这个文件整份覆盖线上配置。

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name luozhe.link www.luozhe.link;

    root /var/www/luozhe.link;
    index index.html;

    charset utf-8;
    access_log /var/log/nginx/luozhe.link.access.log;
    error_log  /var/log/nginx/luozhe.link.error.log;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 构建产物文件名带内容哈希，可以放心长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=604800";
    }

    # index.html 每次都要回源确认，否则发新版后用户还在跑旧页面
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
